<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Alarm Clock Case: Apple iOS Red (#FF3B30) -->
  <g stroke="#FF3B30">
    <!-- Top button stem -->
    <line x1="256" y1="106.67" x2="256" y2="68.27" stroke-width="42.67" />
    <!-- Top button cap -->
    <line x1="202.67" y1="46.93" x2="309.33" y2="46.93" stroke-width="53.33" />
    <!-- Left bell dome -->
    <path d="M 81.07 187.73 A 74.67 74.67 0 0 1 174.93 106.67" stroke-width="42.67" />
    <!-- Right bell dome -->
    <path d="M 337.07 106.67 A 74.67 74.67 0 0 1 430.93 187.73" stroke-width="42.67" />
    <!-- Main circular clock face with white dial -->
    <circle cx="256" cy="277.33" r="170.67" stroke-width="42.67" fill="#FFFFFF" />
  </g>

  <!-- Clock Hands & Center Pin: Always Black (#000000) -->
  <g stroke="#000000">
    <!-- Minute hand (12 o'clock) -->
    <line x1="256" y1="277.33" x2="256" y2="160" stroke-width="42.67" />
    <!-- Hour hand (3 o'clock) -->
    <line x1="256" y1="277.33" x2="337.07" y2="277.33" stroke-width="42.67" />
  </g>
  <!-- Central pin -->
  <circle cx="256" cy="277.33" r="23.47" fill="#000000" />
</svg>
